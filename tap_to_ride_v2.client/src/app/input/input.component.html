
<div class="terminal">
  <h1>Tap to Ride</h1>

  <form class="fare-form" (ngSubmit)="recordFare()">
    <label class="field">
      <span>Rider code</span>
      <!--<input [(ngModel)]="riderId" name="riderId" required autofocus />-->
      <select [(ngModel)]="riderId" name="riderId" required autofocus>
        <option value="" disabled hidden>Select a rider</option>
        @for (rider of riders; track rider) {
        <option [value]="rider">{{ rider }}</option>
        }
      </select>
    </label>


    <label class="field">
      <span>Fare</span>
      <input [(ngModel)]="fareCents" name="fareCents" type="number" required />
    </label>

    <button type="submit" class="take-fare">Take fare</button>
  </form>

  <div class="readout">
    <div class="counter">
      <span class="counter-value">{{ unsent }}</span>
      <span class="counter-label">unsent</span>
    </div>

    @if (showTick) {
    <div class="tick" [@fadeTick]>
      <svg viewBox="0 0 24 24" fill="none" role="img">
        <title>Fare recorded</title>
        <path d="M3.5 13 L9 18.5 L20.5 5"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round" />
      </svg>
    </div>
    }

    <div class="status" [class.status-ok]="lastSyncOk" [class.status-bad]="!lastSyncOk">
      {{ lastSyncOk ? 'server reachable' : 'server unreachable' }}
    </div>
  </div>

  <app-unsent></app-unsent>
</div>
